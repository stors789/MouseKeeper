[package]
name = "mousekeeper"
version = "0.1.0"
description = "Native shell for the MouseKeeper local-first application"
authors = ["MouseKeeper contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mousekeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-stronghold = "2"
argon2 = "0.5"

# Stronghold's password KDF is otherwise painfully slow in unoptimized dev builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.scrypt]
opt-level = 3
